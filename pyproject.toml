[project]
name = "research-cockpit"
version = "0.1.0"
description = "Personal research cockpit: RAG over your papers, literature KB, and citation graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "networkx>=3.4",
    "bibtexparser>=1.4,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.49",
    "streamlit-agraph>=0.0.45",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "build>=1.2",
]
ocr = ["ocrmypdf>=16"]

[project.scripts]
rc = "research_cockpit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_cockpit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "specs", "README.md", "pyproject.toml", ".streamlit/config.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern uses function calls in argument defaults
"src/research_cockpit/cli.py" = ["B008"]
# inline SVG data-URIs in the injected CSS cannot be wrapped
"src/research_cockpit/ui/app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
